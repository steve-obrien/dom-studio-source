name: Publish DOM Studio

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag to publish or recover
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # npm trusted publishing currently requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    environment: npm-release
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify annotated release tag on main
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" main
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          node scripts/release-npm-package.mjs --check "${RELEASE_TAG#v}"
      - run: npm ci
      - run: npm ci --prefix packages/now
      - run: npm run check:releases
      - run: npm --prefix packages/now test -- --run
      - run: npm run build
      - run: npm run package:smoke
      - name: Verify generated tracked files
        run: git diff --exit-code
      - name: Publish tested package and verify registry integrity
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git show "$WORKFLOW_SHA:scripts/publish-release.mjs" > "$RUNNER_TEMP/publish-release.mjs"
          GITHUB_REF="refs/tags/$RELEASE_TAG" node "$RUNNER_TEMP/publish-release.mjs"
      - name: Publish the reviewed GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "Release already exists; preserving its published notes."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "DOM Studio ${RELEASE_TAG#v}" --notes-file dist/release-notes.md
          fi
